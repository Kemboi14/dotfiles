source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    color = $primary
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = $onSurfaceVariant
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    rounding = 14
    outline_thickness = 2
    outer_color = $primary
    inner_color = $surfaceContainer
    font_color = $onSurface
    check_color = $tertiary
    fail_color = $error
    fail_text = <i>authentication failure · attempt $ATTEMPTS</i>
    placeholder_text = <i>password…</i>
    dots_center = true
    position = 0, -60
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.face
    size = 120
    rounding = -1
    border_size = 3
    border_color = $primary
    position = 0, 290
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format "󰎆  {{ title }} — {{ artist }}" 2>/dev/null
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = $tertiary
    position = 0, 60
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT*/capacity)%"
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    color = $onSurfaceVariant
    position = -30, -25
    halign = right
    valign = top
}

# --- nerdy terminal layer ---
label {
    monitor =
    text = cmd[update:1000] echo "$USER@$(cat /etc/hostname) ~ ❯ unlock$(case $(date +%S) in (*[02468]) echo ▌;; esac)"
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = $primary
    position = 0, 5
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] echo " kernel  $(uname -r)"
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    color = $onSurfaceVariant
    position = 30, -25
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] echo "󰔟 uptime  $(uptime -p | cut -c4-)"
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    color = $onSurfaceVariant
    position = 30, -48
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:5000] echo "󰍛 load    $(cut -d" " -f1-3 /proc/loadavg)"
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    color = $onSurfaceVariant
    position = 30, -71
    halign = left
    valign = top
}
