source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 96
    font_family = FiraCode Nerd Font
    color = $primary
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    font_family = Inter
    color = $onSurfaceVariant
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    rounding = 14
    outline_thickness = 2
    outer_color = $primary
    inner_color = $surfaceContainer
    font_color = $onSurface
    check_color = $tertiary
    fail_color = $error
    placeholder_text = <i>password…</i>
    dots_center = true
    position = 0, -60
    halign = center
    valign = center
}
