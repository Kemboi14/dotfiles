source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 96
    font_family = JetBrainsMono Nerd Font Propo
    color = $onSurface
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 16
    font_family = JetBrainsMono Nerd Font Propo
    color = $onSurfaceVariant
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    rounding = -1
    outline_thickness = 1
    outer_color = $outlineVariant
    inner_color = $surfaceContainer
    font_color = $onSurface
    check_color = $primary
    fail_color = $error
    fail_text = <i>try again</i>
    placeholder_text =
    dots_center = true
    dots_size = 0.22
    fade_on_empty = true
    position = 0, -50
    halign = center
    valign = center
}
