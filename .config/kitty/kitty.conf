shell fish
# font_family FiraCode Nerd Font

background_opacity 0.85
dynamic_background_opacity yes


# --- Look ---
font_size 11.5
window_padding_width 6 12
hide_window_decorations yes
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0
url_style curly

# --- Splits & tabs ---
enabled_layouts splits,stack
draw_minimal_borders yes
inactive_text_alpha 0.75
tab_bar_min_tabs 2
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# --- Quiet ---
enable_audio_bell no
confirm_os_window_close 0
scrollback_lines 10000

# --- Nerdy font details ---
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD FiraCode Nerd Font
modify_font cell_height 108%

# --- Shortcuts: splits & tabs ---
map ctrl+shift+enter launch --cwd=current --location=split
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+z toggle_layout stack
map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+l neighboring_window right
map ctrl+alt+shift+h resize_window narrower
map ctrl+alt+shift+l resize_window wider
map ctrl+alt+shift+k resize_window taller
map ctrl+alt+shift+j resize_window shorter


# BEGIN_KITTY_FONTS
font_family      family="FiraCode Nerd Font" style="Retina"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
# crisper light-on-dark text
text_composition_strategy 1.2 20
modify_font cell_height 108%
font_features FiraCodeNF-Bold +zero +ss02 +ss05 +ss07
font_features FiraCodeNF-Reg +zero +ss02 +ss05 +ss07
font_features FiraCodeNF-Ret +zero +ss02 +ss05 +ss07
