# shell
shell fish

# --- Font ---
font_family      family="JetBrainsMono Nerd Font Mono" style="Regular"
bold_font        family="JetBrainsMono Nerd Font Mono" style="Bold"
italic_font      family="JetBrainsMono Nerd Font Mono" style="Italic"
bold_italic_font family="JetBrainsMono Nerd Font Mono" style="Bold Italic"
font_size 11.5
modify_font cell_height 110%
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD JetBrainsMono Nerd Font Mono
text_composition_strategy 1.0 0

# --- Transparency / look (wallpaper shows through; Hyprland blur handles glass) ---
background_opacity 0.74
dynamic_background_opacity yes
window_padding_width 10 14
hide_window_decorations yes
placement_strategy center
inactive_text_alpha 0.85
draw_minimal_borders yes
window_border_width 1pt
window_margin_width 0

# --- Cursor ---
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0
cursor_trail 1
cursor_trail_decay 0.1 0.3

# --- URLs / mouse / selection ---
url_style curly
underline_hyperlinks hover
copy_on_select clipboard
mouse_hide_wait 2.0
strip_trailing_spaces smart
focus_follows_mouse no

# --- Shell integration / power features ---
shell_integration enabled
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}
scrollback_lines 20000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 3.0

# --- Splits, tabs, layouts ---
enabled_layouts splits,stack,tall,fat,grid
tab_bar_min_tabs 2
tab_bar_edge top
tab_bar_style separator
tab_separator "  ·  "
tab_bar_margin_height 4 2
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {tab.active_wd.rsplit('/', 1)[-1] or '/'}"
active_tab_font_style bold
inactive_tab_font_style normal

# --- Behavior ---
enable_audio_bell no
visual_bell_duration 0.0
confirm_os_window_close 0
update_check_interval 0

# --- Shortcuts: splits & tabs ---
map ctrl+shift+enter launch --cwd=current --location=split
map ctrl+shift+\ launch --cwd=current --location=vsplit
map ctrl+shift+minus launch --cwd=current --location=hsplit
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_window
map ctrl+shift+z toggle_layout stack
map ctrl+shift+] next_tab
map ctrl+shift+[ previous_tab

# --- Shortcuts: window navigation/resize ---
map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+l neighboring_window right
map ctrl+alt+shift+h resize_window narrower
map ctrl+alt+shift+l resize_window wider
map ctrl+alt+shift+k resize_window taller
map ctrl+alt+shift+j resize_window shorter

# --- Shortcuts: power kittens/tools ---
map ctrl+shift+f launch --type=overlay --stdin-source=@screen_scrollback less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
map ctrl+shift+g launch --type=overlay --cwd=current lazygit
map ctrl+shift+e open_url_with_hints
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+p>l kitten hints --type line --program -
map ctrl+shift+p>w kitten hints --type word --program -
map ctrl+shift+u kitten unicode_input
map ctrl+shift+escape kitty_shell window
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+backspace change_font_size all 0

# Wallpaper/theme colors (generated/managed by raw-theme)
include colors.conf

# --- latency (120 Hz panel) ---
repaint_delay 8
input_delay 2
sync_to_monitor yes
