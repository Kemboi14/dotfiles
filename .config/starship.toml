add_newline = true
palette = "wallpaper"
format = """
$directory$git_branch$git_status$python$rust$nodejs$golang$php$lua$c$cmd_duration
$character"""

[palettes.wallpaper]
primary = "#b5c8df"
secondary = "#c1c7d1"
tertiary = "#d9bed9"
success = "#62daa8"
error = "#ffb4ab"
surface = "#050506"
on_surface = "#e4e2e3"
muted = "#c4c6cd"

