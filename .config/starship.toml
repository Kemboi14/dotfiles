[character]
success_symbol = "[❯](bold success)"
error_symbol = "[❯](bold error)"

[git_status]
style = "bold tertiary"

[cmd_duration]
min_time = 2000
style = "muted"
format = "took [$duration]($style) "

[custom.transient_time]
command = "date +%H:%M"
when = true
style = "bright-black"
format = "[$output]($style)"
